name: Release

# Publishes to npm when a tag like v0.2.0 is pushed. npm trusts this workflow directly (trusted publishing), so no
# token is stored here, and every version gets a provenance statement that links it to the commit it was built from.
# Set the version in package.json and CHANGELOG.md first, then tag that commit on main.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Trusted publishing needs npm 11.5.1 or newer, which comes with Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "::notice::$name@$version is already on npm, nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published != 'true'
        run: npm ci
      # prepublishOnly runs the type check and the build.
      - if: steps.version.outputs.published != 'true'
        run: npm publish --provenance
